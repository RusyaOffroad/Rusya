    <script>
     let x = parseInt (prompt("Введите число"));
     let y = parseInt (prompt("Введите число"));
     
     for (i = 0; i=x+y; ){
        alert(i);
     }
     let num1 = parseInt (prompt("Введите число"));
     let num2 = parseInt (prompt("Введите число"));
     let num3;

     while (num1 !=num2){
        if (num1 > num2){
            num1 = num1 - num2;
        }
        else {
            num2 = num2 - num1;
        }
     }
     num3 = num1;
     alert(num3);
     
     let num = parseInt (prompt("Введите число"));
     alert(findNumber(num));
     function findNumber(x){
        let numbers = [];
        for (let i = 1; i<=x; i++){
            if (x % i === 0){
                numbers.push(i);
            }
        }
        return numbers;
     }
     let numb1 = prompt ('Введите число');
     function findNumb (x){
        let a = 0;
        while (a < x.length) a++;
        return a;
     }
     alert(findNumb(numb1));
