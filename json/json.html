<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON,AJAX</title>
    <style>
        h4 {
            text-align: center;
        }

        .userDiv {
            display: inline;
            margin: 10px;
            padding: 10px;
            border: 1px solid black;

        }
    </style>
    <script>

        // let user = {
        //     id: 1,
        //     name : "UserName",
        //     old: 38 
        // }
        // let jsonString = JSON.stringify(user)
        // console.log(JSON.stringify(user));

        let request = new XMLHttpRequest();
        let response;
        request.open("GET", "https://jsonplaceholder.typicode.com/users")
        request.send();
        request.onload = function () {
            response = request.response;
            console.log(JSON.parse(response));
            let users = JSON.parse(response);
            let user = users[0];
            alert(user.email);
        
         
            for (let i = 0; i < users.lenght; i++) {
                const user = users[i].name;

                let userDiv = document.createElement("div");
                userDiv.innerText = user.name;
                userDiv.className = "userDiv";
                userDiv.onclick = function () {
                    document.getElementById("user - info").innerHTML =
                        `<table>
                             <tr>
            <td>Name:</td>
            <td>${user.username}</td>
            <td>Username:</td>
            <td>${user.username}</td>
            <td>Address:</td>
            <td>Email:</td>
            <td>Phone:</td>
            <td>Website:</td>
        </tr>
        </table>`;
        let button = document.createElement("button");
        button.innerText = "Show posts";
          button.click = function (){
            let postsRequest = new XMLHttpRequest();
            request.open("https://jsonplaceholder.typicode.com/users");
            postsRequest.send();
            postsRequest.onload = function(){
                let posts = JSON.parse(postsRequest.response);
                for (let i =0; i < postsRequest.response);
                let postDiv = document.createElement("div");
                postDiv.innerHTML = 
                `<h5>${posts[i].title}</h5> <p>${posts[i].body}</p>`
                document.getElementById("user - posts").appendChild(postDiv);
            }
          }
    }
    userDiv.appendChild(userDiv);
                }
                userDiv.appendChild(userDiv);
            }
        


    </script>
</head>

<body>
    <h4>All users:</h4>
    <div id="users">
    </div>
    <h4> User info:</h4>
    <div id="user - info"></div>
    <h4> User posts:</h4>
    <div id="user - posts"></div>

    <h5></h5> <p></p>
    
    
</body>

</html>
